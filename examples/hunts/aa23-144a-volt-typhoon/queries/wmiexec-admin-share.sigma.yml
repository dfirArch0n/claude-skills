title: Remote Command Output Redirected to ADMIN$ (Impacket wmiexec Pattern)
id: 7b2d4ea6-5f9a-4c1b-d3e4-6f7a8b9c0d66
status: experimental
description: >
    Impacket's wmiexec runs each command as cmd.exe /Q /c and writes the output
    to a file in the ADMIN$ share named with an epoch timestamp. AA23-144A gives
    the pattern as cmd.exe /Q /c * 1> \\127.0.0.1\ADMIN$\__*.*>&1. This is the
    delivery vehicle the actor used for ntdsutil and for discovery, so a hit here
    widens the hunt to everything else that account ran.
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-144a
author: threat-hunt skill worked example
date: 2026-09-30
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|all:
            - '/Q'
            - '/c'
            - '\\\\127.0.0.1\\ADMIN$\\__'
    condition: selection
falsepositives:
    - Authorized penetration testing with Impacket
level: high
tags:
    - attack.execution
    - attack.t1047
