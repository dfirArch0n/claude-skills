# Canary rule for setup_sigma.sh --check. Its job is to exercise every backend
# with constructs a real hunt rule uses -- endswith lists, a contains match, and
# a negated filter -- so a backend that is installed but broken fails here rather
# than in the middle of a hunt.
title: Canary - RMM Agent Installed By Non-Deployment Parent
id: 6f1a2b3c-4d5e-4f60-8a91-b2c3d4e5f607
status: experimental
description: Canary rule used to verify Sigma backends convert correctly.
author: threat-hunt skill
date: 2026-09-29
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\AnyDesk.exe'
            - '\ScreenConnect.ClientService.exe'
            - '\AteraAgent.exe'
        CommandLine|contains: '--install'
    filter_deployment:
        ParentImage|endswith:
            - '\ccmexec.exe'
            - '\msiexec.exe'
    condition: selection and not filter_deployment
falsepositives:
    - Sanctioned RMM rollout outside the deployment system
level: medium
tags:
    - attack.persistence
    - attack.t1543.003
